<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>User Profile - Event Hall Booking</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>
  <div class="dashboard-layout">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        👤 My Account
      </div>
      <a href="#" class="nav-item active" onclick="loadView('overview')">📊 Overview</a>
      <a href="#" class="nav-item" onclick="loadView('bookings')">📅 My Bookings</a>
      <a href="#" class="nav-item" onclick="loadView('waitlist')">📋 My Waitlist</a>

      <div style="margin-top: auto; padding-top: 2rem;">
        <a href="/" class="nav-item">← Back to Site</a>
        <a href="#" class="nav-item" onclick="logout()">🚪 Logout</a>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content" id="profileContent">
      <div class="loading">
        <div class="spinner"></div>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    let bookings = [];
    let user = null;

    async function initProfile() {
      user = await getCurrentUser();
      if (!user) { window.location.href = '/login.html'; return; }

      const token = sessionStorage.getItem('token');
      try {
        const res = await fetch(`${API_URL}/bookings`, { headers: { 'Authorization': `Bearer ${token}` } });
        bookings = (await res.json()).bookings || [];
        loadView('overview');
      } catch (e) {
        console.error(e);
        showAlert('Failed to load profile data', 'error');
      }
    }

    function loadView(view) {
      document.querySelectorAll('.nav-item').forEach(el =>
        el.classList.toggle('active', el.textContent.toLowerCase().includes(view))
      );

      const content = document.getElementById('profileContent');

      if (view === 'overview') {
        content.innerHTML = `
            <div style="display:flex; align-items:center; gap:1.5rem; margin-bottom:2rem; background:white; padding:2rem; border-radius:12px; border:1px solid var(--border);">
               <div style="width:80px; height:80px; background:linear-gradient(135deg, var(--primary), var(--secondary)); color:white; font-size:2.5rem; display:flex; align-items:center; justify-content:center; border-radius:50%; font-weight:700;">
                  ${user.name.charAt(0).toUpperCase()}
               </div>
               <div>
                  <h1 style="margin:0; font-size:2rem;">${user.name}</h1>
                  <p class="text-muted" style="margin-top:0.5rem;">${user.email} • ${user.phone}</p>
               </div>
            </div>

            <h2 style="margin-bottom:1.5rem;">Recent Activity</h2>
            ${bookings.length === 0 ? `
               <div class="card" style="text-align:center; padding:3rem;">
                  <h3>No bookings yet</h3>
                  <p class="text-muted">Start exploring venues for your next event!</p>
                  <a href="/halls.html" class="btn btn-primary" style="margin-top:1rem;">Browse Halls</a>
               </div>
            ` : `
               <div class="grid grid-3">
                  ${bookings.slice(0, 3).map(b => bookingCard(b)).join('')}
               </div>
               ${bookings.length > 3 ? `<button class="btn btn-secondary" style="margin-top:1rem;" onclick="loadView('bookings')">View All Bookings</button>` : ''}
            `}
         `;
      }
      else if (view === 'bookings') {
        content.innerHTML = `
            <h1 style="margin-bottom:2rem;">My Bookings</h1>
            ${bookings.length === 0 ? '<p class="text-muted">No bookings found.</p>' : `
               <div class="grid grid-3">
                  ${bookings.map(b => bookingCard(b)).join('')}
               </div>
            `}
         `;
      }
      else if (view === 'waitlist') {
        loadWaitlistView();
      }
    }

    function bookingCard(b) {
      return `
        <div class="card">
           <div class="card-body">
              <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
                 <span class="badge badge-${b.status === 'confirmed' ? 'success' : b.status === 'cancelled' ? 'danger' : 'warning'}">${b.status}</span>
                 <span style="font-weight: 600; font-size: 0.9rem; color: #64748b;">#${b._id ? b._id.toString().substring(0, 8) : b.id || ''}</span>
              </div>
              <h3 class="card-title">${b.hall ? b.hall.name : 'Unknown Hall'}</h3>
              <div style="color: #64748b; margin-bottom: 1rem;">
                 <div>📍 ${b.hall ? b.hall.location : ''}</div>
                 <div style="margin-top: 0.5rem;">
                   📅 ${b.isMultiDay && b.startDate && b.endDate 
                     ? `${formatDate(b.startDate)} - ${formatDate(b.endDate)} (${Math.floor((new Date(b.endDate) - new Date(b.startDate)) / (1000 * 60 * 60 * 24)) + 1} days)`
                     : formatDate(b.date || b.startDate)}
                 </div>
              </div>
              <div style="margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
                 <span style="font-weight: 700; font-size: 1.1rem;">${formatCurrency(b.amount)}</span>
                 <div style="display: flex; gap: 0.5rem;">
                   <a href="/booking-management.html?id=${b._id || b.id}" class="btn btn-primary" style="font-size: 0.8rem; padding: 0.5rem 1rem;">Manage</a>
                   <a href="/hall.html?id=${b.hallId}" class="btn btn-secondary" style="font-size: 0.8rem; padding: 0.5rem 1rem;">View Venue</a>
                 </div>
              </div>
           </div>
        </div>
      `;
    }

    async function loadWaitlistView() {
      const content = document.getElementById('profileContent');
      const waitlist = await getMyWaitlist();

      content.innerHTML = `
        <h1 style="margin-bottom:2rem;">My Waitlist</h1>
        ${waitlist.length === 0 ? `
          <div class="card" style="text-align:center; padding:3rem;">
            <h3>No waitlist entries</h3>
            <p class="text-muted">You haven't joined any waitlists yet.</p>
            <a href="/halls.html" class="btn btn-primary" style="margin-top:1rem;">Browse Halls</a>
          </div>
        ` : `
          <div class="grid grid-2">
            ${waitlist.map(entry => `
              <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:start; margin-bottom:1rem;">
                  <div>
                    <h3 style="margin:0 0 0.5rem 0;">${entry.hall ? entry.hall.name : 'Unknown Hall'}</h3>
                    <p style="color:var(--text-secondary); margin:0;">📍 ${entry.hall ? entry.hall.location : ''}</p>
                  </div>
                  <span class="badge badge-${entry.status === 'notified' ? 'success' : 'warning'}">
                    ${entry.status === 'notified' ? 'Notified' : 'Waiting'}
                  </span>
                </div>
                <div style="padding:1rem; background:var(--bg-muted); border-radius:8px; margin-bottom:1rem;">
                  <div style="font-size:0.85rem; color:var(--text-secondary); margin-bottom:0.25rem;">Event Date</div>
                  <div style="font-weight:600;">${formatDate(entry.date)}</div>
                  <div style="font-size:0.85rem; color:var(--text-secondary); margin-top:0.5rem;">
                    Position: #${entry.position || 'N/A'}
                  </div>
                  ${entry.status === 'notified' ? `
                    <div style="margin-top:0.75rem; padding:0.75rem; background:#d1fae5; border-radius:6px; color:#065f46; font-size:0.9rem;">
                      ⚠️ You've been notified! Book within 24 hours or you'll lose your spot.
                    </div>
                  ` : ''}
                </div>
                <div style="display:flex; gap:0.5rem;">
                  ${entry.status === 'notified' ? `
                    <a href="/booking.html?hallId=${entry.hallId}&date=${entry.date}" class="btn btn-primary" style="flex:1;">Book Now</a>
                  ` : ''}
                  <button onclick="leaveWaitlistEntry('${entry._id}')" class="btn btn-secondary">Remove</button>
                </div>
              </div>
            `).join('')}
          </div>
        `}
      `;
    }

    async function leaveWaitlistEntry(waitlistId) {
      if (!confirm('Are you sure you want to remove this from your waitlist?')) {
        return;
      }

      const result = await leaveWaitlist(waitlistId);
      if (result.success) {
        showAlert('Removed from waitlist', 'success');
        loadWaitlistView();
      } else {
        showAlert(result.message || 'Failed to remove from waitlist', 'error');
      }
    }

    initProfile();
  </script>
</body>

</html>

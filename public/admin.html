<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Admin Portal - Event Hall Booking</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <div class="dashboard-layout">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        🏛️ AdminPortal
      </div>
      <a href="#" class="nav-item active" onclick="loadView('stats')">📊 Overview</a>
      <a href="#" class="nav-item" onclick="loadView('halls')">🏛️ Manage Halls</a>
      <a href="#" class="nav-item" onclick="loadView('users')">👥 Manage Users</a>
      <a href="#" class="nav-item" onclick="loadView('bookings')">📅 Bookings</a>
      <div style="margin-top: auto; padding-top: 2rem;">
        <a href="/" class="nav-item">← Back to Site</a>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content" id="adminContent">
      <div class="loading">
        <div class="spinner"></div>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    let stats, halls, users, bookings;

    async function initAdmin() {
      const token = sessionStorage.getItem('token');
      if (!token) { window.location.href = '/login.html'; return; }

      // Fetch all data
      try {
        const [s, h, u, b] = await Promise.all([
          fetch(`${API_URL}/admin/stats`, { headers: { 'Authorization': `Bearer ${token}` } }),
          fetch(`${API_URL}/admin/halls`, { headers: { 'Authorization': `Bearer ${token}` } }),
          fetch(`${API_URL}/admin/users`, { headers: { 'Authorization': `Bearer ${token}` } }),
          fetch(`${API_URL}/admin/bookings`, { headers: { 'Authorization': `Bearer ${token}` } })
        ]);

        const sData = await s.json(); stats = sData.stats;
        const hData = await h.json(); halls = hData.halls;
        const uData = await u.json(); users = uData.users;
        const bData = await b.json(); bookings = bData.bookings;

        loadView('stats');
      } catch (e) {
        console.error(e);
        showAlert('Failed to load admin data', 'error');
      }
    }

    function loadView(view) {
      const content = document.getElementById('adminContent');
      document.querySelectorAll('.nav-item').forEach(el =>
        el.classList.toggle('active', el.textContent.includes(view === 'stats' ? 'Overview' : view === 'halls' ? 'Halls' : view === 'users' ? 'Users' : 'Bookings'))
      );

      if (view === 'stats') {
        content.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem;">
               <h1 style="font-size: 2rem;">System Overview</h1>
               <div style="color:var(--text-muted);">${new Date().toLocaleDateString()}</div>
            </div>
            <div class="stats-grid">
              <div class="stat-card"><div class="stat-value">${stats.totalUsers}</div><div class="stat-label">Users</div></div>
              <div class="stat-card"><div class="stat-value">${stats.totalHalls}</div><div class="stat-label">Halls</div></div>
              <div class="stat-card"><div class="stat-value">${stats.totalBookings}</div><div class="stat-label">Bookings</div></div>
              <div class="stat-card"><div class="stat-value">${formatCurrency(stats.totalRevenue)}</div><div class="stat-label">Revenue</div></div>
            </div>
          `;
      } else if (view === 'halls') {
        content.innerHTML = `
            <h1 style="margin-bottom:2rem;">Manage Halls</h1>
            <div class="card" style="overflow:visible;">
               <div style="overflow-x:auto;">
                 <table style="width:100%; border-collapse:collapse; text-align:left;">
                    <thead style="background:#f1f5f9; border-bottom:1px solid #e2e8f0;">
                       <tr><th style="padding:1rem;">Name</th><th style="padding:1rem;">Owner</th><th style="padding:1rem;">Status</th><th style="padding:1rem;">Price</th><th style="padding:1rem;">Action</th></tr>
                    </thead>
                    <tbody>
                      ${halls.map(h => `
                         <tr style="border-bottom:1px solid #e2e8f0;">
                           <td style="padding:1rem; font-weight:500;">${h.name}</td>
                           <td style="padding:1rem;">${h.ownerId}</td>
                           <td style="padding:1rem;"><span class="badge badge-${h.status === 'approved' ? 'success' : 'warning'}">${h.status}</span></td>
                           <td style="padding:1rem;">${formatCurrency(h.price)}</td>
                           <td style="padding:1rem; display:flex; gap:0.5rem;">
                             ${h.status === 'pending' ? `<button class="btn btn-success" style="padding:0.4rem 0.8rem; font-size:0.85rem;" onclick="approve('${h._id}')">Approve</button>` : ''}
                             <button class="btn btn-danger" style="padding:0.4rem 0.8rem; font-size:0.85rem;" onclick="del('${h._id}')">Delete</button>
                           </td>
                         </tr>
                      `).join('')}
                    </tbody>
                 </table>
               </div>
            </div>
          `;
      }
      else if (view === 'users') {
        content.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem;">
             <h1>Manage Users</h1>
             <button class="btn btn-primary" onclick="showCreateOwnerModal()">+ Create Owner</button>
          </div>

           <div class="card" style="overflow:visible;">
               <div style="overflow-x:auto;">
                 <table style="width:100%; border-collapse:collapse; text-align:left;">
                    <thead style="background:#f1f5f9; border-bottom:1px solid #e2e8f0;">
                       <tr><th style="padding:1rem;">Name</th><th style="padding:1rem;">Email</th><th style="padding:1rem;">Role</th><th style="padding:1rem;">Action</th></tr>
                    </thead>
                    <tbody>
                      ${users.map(u => `
                         <tr style="border-bottom:1px solid #e2e8f0;">
                           <td style="padding:1rem; font-weight:500;">${u.name}</td>
                           <td style="padding:1rem;">${u.email}</td>
                           <td style="padding:1rem;"><span class="badge badge-${u.role === 'admin' ? 'danger' : u.role === 'owner' ? 'info' : 'success'}">${u.role}</span></td>
                           <td style="padding:1rem;">
                              <!-- Placeholder for delete/edit user if needed -->
                           </td>
                         </tr>
                      `).join('')}
                    </tbody>
                 </table>
               </div>
            </div>

            <!-- Create Owner Modal -->
            <div id="createOwnerModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:2000;">
              <div class="card" style="width:400px; padding:2rem; background:white;">
                 <h2 style="margin-bottom:1.5rem;">Create Owner Account</h2>
                 <form onsubmit="handleCreateOwner(event)">
                    <div class="form-group"><label>Name</label><input type="text" id="ownerName" required></div>
                    <div class="form-group"><label>Email</label><input type="email" id="ownerEmail" required></div>
                    <div class="form-group"><label>Phone</label><input type="tel" id="ownerPhone" required></div>
                    <div class="form-group"><label>Password</label><input type="password" id="ownerPassword" required></div>
                    <div style="display:flex; gap:1rem; margin-top:1.5rem;">
                       <button type="submit" class="btn btn-primary w-full">Create</button>
                       <button type="button" class="btn btn-secondary w-full" onclick="document.getElementById('createOwnerModal').style.display='none'">Cancel</button>
                    </div>
                 </form>
              </div>
            </div>
        `;
        // Re-attach modal display logic if needed or keep inline styled
        document.getElementById('createOwnerModal').style.display = 'none';
      }
      else if (view === 'bookings') {
        content.innerHTML = `<h1>All Bookings</h1><p class="text-muted">Booking management view goes here</p>`;
      }
    }

    function showCreateOwnerModal() {
      document.getElementById('createOwnerModal').style.display = 'flex';
    }

    async function handleCreateOwner(e) {
      e.preventDefault();
      const name = document.getElementById('ownerName').value;
      const email = document.getElementById('ownerEmail').value;
      const phone = document.getElementById('ownerPhone').value;
      const password = document.getElementById('ownerPassword').value;
      const token = sessionStorage.getItem('token');

      try {
        const res = await fetch(`${API_URL}/admin/create-owner`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ name, email, phone, password })
        });
        const data = await res.json();
        if (data.success) {
          alert('Owner created successfully! Welcome email sent.');
          document.getElementById('createOwnerModal').style.display = 'none';
          initAdmin(); // Refresh
        } else {
          alert(data.message);
        }
      } catch (err) {
        console.error(err);
        alert('Failed to create owner');
      }
    }

    async function approve(id) {
      const token = sessionStorage.getItem('token');
      await fetch(`${API_URL}/admin/halls/${id}/approve`, { method: 'PUT', headers: { 'Authorization': `Bearer ${token}` } });
      initAdmin();
    }

    async function del(id) {
      const token = sessionStorage.getItem('token');
      if (confirm('Delete this hall?')) {
        await fetch(`${API_URL}/halls/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
        initAdmin();
      }
    }

    initAdmin();
  </script>
</body>

</html>

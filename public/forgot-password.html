<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Event Hall Booking</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a href="/" class="navbar-brand">🏛️ Event Hall Booking</a>
            <button class="navbar-toggle" onclick="toggleMobileMenu()">☰</button>
            <ul class="navbar-nav">
                <li><a href="/index.html">Home</a></li>
                <li><a href="/halls.html">Halls</a></li>
                <li><a href="/login.html">Login</a></li>
                <li><a href="/signup.html">Sign Up</a></li>
            </ul>
        </div>
    </nav>

    <div class="container" style="padding: 3rem 0;">
        <div class="booking-form" style="max-width: 450px; margin: 0 auto;">
            <h1 style="text-align: center; margin-bottom: 2rem;">Reset Password</h1>

            <!-- Step 1: Email -->
            <form id="step1Form" onsubmit="handleSendOtp(event)">
                <p style="color: #6b7280; margin-bottom: 1.5rem; text-align: center;">
                    Enter your email address and we'll send you an OTP to reset your password.
                </p>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>
                <button type="submit" class="btn btn-primary w-full" id="sendOtpBtn">Send OTP</button>
            </form>

            <!-- Step 2: OTP -->
            <form id="step2Form" onsubmit="handleVerifyOtp(event)" style="display: none;">
                <p style="color: #6b7280; margin-bottom: 1.5rem; text-align: center;">
                    Enter the 6-digit OTP sent to <span id="displayEmail" style="font-weight: 600;"></span>
                </p>
                <div class="form-group">
                    <label for="otp">OTP Code</label>
                    <input type="text" id="otp" placeholder="123456" maxlength="6" pattern="\d{6}" required
                        style="letter-spacing: 0.5rem; text-align: center; font-size: 1.25rem;">
                </div>
                <button type="submit" class="btn btn-primary w-full" id="verifyOtpBtn">Verify OTP</button>
                <button type="button" class="btn w-full"
                    style="margin-top: 0.5rem; background: transparent; color: #6b7280;"
                    onclick="showStep(1)">Back</button>
            </form>

            <!-- Step 3: New Password -->
            <form id="step3Form" onsubmit="handleResetPassword(event)" style="display: none;">
                <p style="color: #6b7280; margin-bottom: 1.5rem; text-align: center;">
                    Create a new password for your account.
                </p>
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" placeholder="••••••••" required minlength="6"
                        onkeyup="checkStrength()">
                    <!-- Strength Meter -->
                    <div class="password-strength-meter">
                        <div class="password-strength-bar" id="strengthBar"></div>
                    </div>
                    <div class="password-hint" id="strengthText"></div>
                </div>
                <div class="form-group">
                    <label for="confirmNewPassword">Confirm New Password</label>
                    <input type="password" id="confirmNewPassword" placeholder="••••••••" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary w-full" id="resetBtn">Reset Password</button>
            </form>

            <div style="margin-top: 1.5rem; text-align: center;">
                <a href="/login.html" style="color: #6366f1; text-decoration: none; font-size: 0.9rem;">Back to
                    Login</a>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        let userEmail = '';
        let verifiedOtp = '';

        function showStep(step) {
            document.getElementById('step1Form').style.display = step === 1 ? 'block' : 'none';
            document.getElementById('step2Form').style.display = step === 2 ? 'block' : 'none';
            document.getElementById('step3Form').style.display = step === 3 ? 'block' : 'none';
        }

        async function handleSendOtp(event) {
            event.preventDefault();
            const emailInput = document.getElementById('email');
            const btn = document.getElementById('sendOtpBtn');

            btn.disabled = true;
            btn.textContent = 'Sending...';

            const result = await forgotPassword(emailInput.value);

            if (result.success) {
                userEmail = emailInput.value;
                document.getElementById('displayEmail').textContent = userEmail;
                showAlert('OTP sent successfully!', 'success');
                showStep(2);
            } else {
                showAlert(result.message || 'Failed to send OTP', 'error');
            }

            btn.disabled = false;
            btn.textContent = 'Send OTP';
        }

        async function handleVerifyOtp(event) {
            event.preventDefault();
            const otpInput = document.getElementById('otp');
            const btn = document.getElementById('verifyOtpBtn');

            btn.disabled = true;
            btn.textContent = 'Verifying...';

            const result = await verifyOtp(userEmail, otpInput.value);

            if (result.success) {
                verifiedOtp = otpInput.value;
                showAlert('OTP verified!', 'success');
                showStep(3);
            } else {
                showAlert(result.message || 'Invalid OTP', 'error');
            }

            btn.disabled = false;
            btn.textContent = 'Verify OTP';
        }

        async function handleResetPassword(event) {
            event.preventDefault();
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmNewPassword').value;
            const btn = document.getElementById('resetBtn');

            if (newPass !== confirmPass) {
                showAlert('Passwords do not match', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Resetting...';

            const result = await resetPassword(userEmail, verifiedOtp, newPass);

            if (result.success) {
                showAlert('Password reset successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 2000);
            } else {
                showAlert(result.message || 'Failed to reset password', 'error');
                btn.disabled = false;
                btn.textContent = 'Reset Password';
            }
        }

        // Password Strength Logic
        function checkStrength() {
            const password = document.getElementById('newPassword').value;
            const bar = document.getElementById('strengthBar');
            const text = document.getElementById('strengthText');
            let strength = 0;

            if (password.length > 5) strength++;
            if (password.length > 8) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;

            bar.className = 'password-strength-bar';
            if (strength < 2) {
                bar.classList.add('strength-weak');
                text.textContent = 'Weak';
                text.style.color = '#ef4444';
            } else if (strength < 4) {
                bar.classList.add('strength-medium');
                text.textContent = 'Medium';
                text.style.color = '#f59e0b';
            } else {
                bar.classList.add('strength-strong');
                text.textContent = 'Strong';
                text.style.color = '#10b981';
            }
        }
    </script>
</body>

</html>
